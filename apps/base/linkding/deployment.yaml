apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkding
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkding
  template:
    metadata:
      labels:
        app: linkding
    spec:
      securityContext:
        fsGroup: 33 # www-data group ID
        runAsUser: 33 # www-data user ID
        runAsGroup: 33 # www-data group ID

      containers:
        - name: linkding
          image: sissbruecker/linkding:1.31.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Running additional command..."
              export USER=$(jq -r '.user' ~/creds/creds.json)
              export PASS=$(jq -r '.pass' ~/creds/creds.json)
          ports:
            - containerPort: 9090

          securityContext:
            allowPrivilegeEscalation: false

          volumeMounts:
            - name: linkding-data
              mountPath: /etc/linkding/datai
            - name: creds
              mountPath: ~/creds
              readOnly: true
      volumes:
        - name: linkding-data
          persistentVolumeClaim:
            claimName: linkding-data-pvc
         - name: creds
           secret:
             secretName: linkding-credentials-secret
