apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkding
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkding
  template:
    metadata:
      labels:
        app: linkding
    spec:
      securityContext:
        fsGroup: 33 # www-data group ID
        runAsUser: 33 # www-data user ID
        runAsGroup: 33 # www-data group ID

      containers:
        - name: linkding
          image: sissbruecker/linkding:1.31.0
            # command: ["/bin/sh", "-c"]
            #args:
            #- |
            #  echo "Running additional command..."
            #  export LD_SUPERUSER_NAME=$(python3 -c "import json; print(json.load(open('~/creds/creds.json'))['user'])")
            #  export LD_SUPERUSER_PASSWORD=$(python3 -c "import json; print(json.load(open('~/creds/creds.json'))['pass'])")
          ports:
            - containerPort: 9090

          securityContext:
            allowPrivilegeEscalation: false

          volumeMounts:
            - name: linkding-data
              mountPath: /etc/linkding/datai
            - name: creds
              mountPath: ~/creds
              readOnly: true
      volumes:
        - name: linkding-data
          persistentVolumeClaim:
            claimName: linkding-data-pvc
        - name: creds
          secret:
             secretName: linkding-credentials-secret
